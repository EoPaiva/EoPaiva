<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-label="HumanReply AI — IA que reescreve conversas no tom certo"><title>HumanReply AI — IA que reescreve conversas no tom certo</title><style>@font-face{font-family:'D';src:url(data:font/woff2;base64,) format('woff2');}
