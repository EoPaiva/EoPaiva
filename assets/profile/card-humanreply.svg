s" cx="129" cy="160" r="3" fill="#fff"/><circle class="bob" style="animation-delay:0.3s" cx="140" cy="160" r="3" fill="#fff"/><text x="160.0" y="164.0" font-family="M,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#5c5c5c" text-anchor="start" letter-spacing="2.2">ANALISANDO TOM  ·  FRUSTRAÇÃO 82%</text></g><g class="b2"><rect x="274.3" y="184" width="261.7" height="62" rx="20" fill="#fff"/><text x="294.3" y="210.0" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#000" text-anchor="start">Sinto muito pela experiência.</text><text x="294.3" y="229.0" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#000" text-anchor="start">Já estou resolvendo isso para você.</text></g><g class="b3"><text x="536.0" y="272.0" font-family="M,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="9.5" fill="#8c8c8c" text-anchor="end" letter-spacing="2.2">TOM: EMPÁTICO   ·   CONTEXTO: RETENÇÃO</text></g></svg>