ass="orb"><circle cx="1186" cy="300" r="4" fill="#fff"/><circle cx="1186" cy="300" r="12" fill="none" stroke="#fff" stroke-opacity=".25"/></g><text x="64.0" y="92.0" font-family="D,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="34" fill="#ffffff" text-anchor="start" letter-spacing="-0.6" class="f1">mPaiva</text><rect class="cur" x="170.7" y="88" width="17" height="3" fill="#fff"/><text x="1216.0" y="90.0" font-family="M,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="12.5" fill="#8c8c8c" text-anchor="end" letter-spacing="3.5" class="f1">PORTFOLIO / 2026</text><rect class="fl dr" x="64" y="124" width="1152" height="1" fill="#1d1d1d"/><g clip-path="url(#c1)"><g class="r1"><text x="60.0" y="290.0" font-family="D,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="96" fill="#ffffff" text-anchor="start" letter-spacing="-3">Código, produto.</text></g></g><g clip-path="url(#c2)"><g class="r2"><text x="60.0" y="408.0" font-family="D,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="96" fill="#4d4d4d" text-anchor="start" letter-spacing="-3">Experiências que marcam.</text></g></g><g clip-path="url(#t2)"><rect class="sw" x="0" y="314" width="360" height="118" fill="url(#shine)"/></g><text x="64.0" y="474.0" font-family="M,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="13" fill="#a3a3a3" text-anchor="start" letter-spacing="3.6" class="f2">FULL STACK DEVELOPMENT  —  AI ENGINEERING  —  DIGITAL PRODUCTS</text><rect class="fl dr" x="64" y="548" width="1152" height="1" fill="#1d1d1d"/><text x="64.0" y="590.0" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#5c5c5c" text-anchor="start" letter-spacing="0.2" class="f2">São José dos Campos — SP, Brasil</text><text x="1216.0" y="590.0" font-family="R,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#d4d4d4" text-anchor="end" letter-spacing="0.2" class="f2">Disponível para novos projetos</text><circle class="fb pl" cx="989.2" cy="585" r="4" fill="#fff"/>