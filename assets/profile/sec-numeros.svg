<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="116" viewBox="0 0 1280 116" role="img" aria-label="03 — Código em produção"><title>03 — Código em produção</title><style>@font-face{font-family:'D';src:url(data:font/woff2;base64,) format('woff2');}
@font-face{font-family:'M';src:url(data:font/woff2;base64,) format('woff2');}
text{font-kerning:normal}
.fb{transform-box:fill-box;transform-origin:center}
